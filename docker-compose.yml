services:
  db:
    image: postgres:15-alpine
    container_name: juridiques-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Juridiques2026
      POSTGRES_DB: juridiques_zero
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - juridiques-network
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d juridiques_zero"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: juridiques-redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - juridiques-network
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: juridiques-ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - juridiques-network
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: juridiques-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:Juridiques2026@db:5432/juridiques_zero
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - juridiques-network
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: juridiques-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    networks:
      - juridiques-network
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  juridiques-network:
    driver: bridge
